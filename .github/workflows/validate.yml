name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # v22.5.0
        with:
          category: "integration"

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master@2026-07-15

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install ruff==0.16.3
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests with coverage
        run: pytest tests/

  smoke:
    name: Live smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Start DashSnap addon
        run: |
          # ponytail: clone default branch until DashSnap 0.1.17 is tagged; then pin --branch v0.1.17 so CI stops chasing addon main
          git clone --depth 1 https://github.com/italo-lombardi/DashSnap.git /tmp/dashsnap
          cd /tmp/dashsnap
          echo '{}' > options.json   # compose bind-mounts this path; absent -> Docker makes a dir
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8099/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8099/health >/dev/null || { docker compose logs; exit 1; }
      - name: Run full-stack smoke
        run: pytest -m smoke --no-cov -q
      - name: Teardown addon
        if: always()
        run: cd /tmp/dashsnap && docker compose down
